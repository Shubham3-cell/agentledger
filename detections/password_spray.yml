id: password-spray
title: Password spray against Entra ID sign-ins
description: >
  Detects a single source IP failing authentication (ResultType 50126 — invalid
  credentials) against many distinct accounts within a short window, the classic
  signature of a password-spray attack.
severity: high
status: production
mitre:
  tactic: CredentialAccess
  technique: T1110.003          # Password Spraying
data_source: SigninLogs
false_positives:
  - Misconfigured application or service account looping on a stale password
references:
  - https://attack.mitre.org/techniques/T1110/003/
query: |
  SigninLogs
  | where ResultType == "50126"            // invalid username or password
  | summarize FailedAccounts = dcount(UserPrincipalName),
              Attempts = count()
      by IPAddress, bin(TimeGenerated, 1h)
  | where FailedAccounts >= 10
  | project TimeGenerated, IPAddress, FailedAccounts, Attempts
  | order by FailedAccounts desc
