# AgentLedger policy — default deny, now argument-aware (Sprint 3).
# A rule grants its effect only when its `where` conditions hold. Anything not
# explicitly granted is denied.

roles:
  reader:
    rules:
      - { tool: list_files, effect: allow }
      - { tool: read_file,  effect: allow, where: { path: { starts_with: "/reports/" } } }
      - { tool: list_inbox, effect: allow }

  operator:
    rules:
      - { tool: list_files, effect: allow }
      # read only inside /reports/ — never /etc, /secrets, anywhere else
      - { tool: read_file,  effect: allow,    where: { path: { starts_with: "/reports/" } } }
      # deleting is destructive AND path-bounded: approval, and only under /reports/
      - { tool: delete_file, effect: approval, where: { path: { starts_with: "/reports/" } } }
      - { tool: list_inbox, effect: allow }
      # outbound mail needs approval, and only to internal recipients
      - { tool: send_email, effect: approval, where: { to: { ends_with: "@company.com" } } }
